name: Build & deploy slides

on:
  push:
    branches: [main]
    paths:
      - "*/slide.md"
      - "images/**"
      - "open-slide/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Marp CLI
        run: npm i -g @marp-team/marp-cli@4

      - name: Build all slide.md with Marp
        run: |
          set -euo pipefail
          mkdir -p public
          # mirror shared images
          if [ -d images ]; then
            cp -R images public/images
          fi
          # build each meetup folder
          for slide in [0-9]*/slide.md; do
            [ -f "$slide" ] || continue
            dir="$(dirname "$slide")"
            mkdir -p "public/$dir"
            # per-meetup local images
            if [ -d "$dir/images" ]; then
              cp -R "$dir/images" "public/$dir/images"
            fi
            echo "Building $slide"
            marp "$slide" --html --allow-local-files \
              -o "public/$dir/index.html"
          done

      - name: Build open-slide deck
        run: |
          set -euo pipefail
          cd open-slide
          npm ci
          npx open-slide build
          cd ..
          mkdir -p public/os
          cp -R open-slide/dist/. public/os/
          # open-slide 是 browser-history SPA：直接開 /os/s/37 或重整時，
          # GitHub Pages 找不到實體檔案，要靠 404.html 把路由交還給 SPA。
          cp public/os/index.html public/os/404.html

      - name: Generate landing index
        run: |
          set -euo pipefail
          {
            echo '<!doctype html><meta charset="utf-8"><title>Flutter Taipei 小聚</title>'
            echo '<style>body{font-family:system-ui;max-width:640px;margin:3rem auto;padding:0 1rem}li{margin:.4rem 0}</style>'
            echo '<h1>Flutter Taipei 小聚</h1><ul>'
            for dir in $(ls -1 public | grep -E '^[0-9]+$' | sort -rn); do
              echo "<li><a href=\"./$dir/\">小聚 #$dir</a></li>"
            done
            echo '</ul>'
            echo '<hr><p><a href="./os/">open-slide 版（React）</a></p>'
          } > public/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
